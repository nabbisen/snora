name: Release

# RFC-090: publishing moves off a laptop and into CI, triggered by the
# release tag. Three refusals must fire before any upload — this
# workflow's whole reason to exist is that a laptop cannot enforce any
# of them:
#
#   1. The tagged commit has no green CI run (checked against the
#      existing run, not by re-running the suites — Q-5).
#   2. The tag does not match [workspace.package].version in Cargo.toml.
#   3. Trusted Publishing is not configured for these crates against
#      this exact workflow file — enforced by crates.io itself at the
#      `cargo publish` step, not pre-checked here: there is no
#      repo-side secret whose presence this workflow could inspect
#      (that is the whole point of choosing OIDC over a token, RFC-090
#      Q-2's final ruling). If it is not configured, publish fails
#      there, loudly, not silently.
#
# A clean tree at the tag needs no check of its own: this workflow *is*
# one — `actions/checkout` at the tag is the clean checkout, and nothing
# here can carry local, uncommitted state the way a laptop can.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a publish mid-flight (Q-3: a half-published release
  # needs a human's judgement, not an interrupted one).
  cancel-in-progress: false

# The floor, so that no job inherits more than it asks for. Each job
# states what it needs (RFC-107): only `publish` gets `id-token`, and
# only `github-release` gets write access to contents.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read    # required to read this commit's CI run status
      id-token: write  # required for crates.io Trusted Publishing (OIDC)
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v6

      - name: Refuse if the tag does not match Cargo.toml's version
        run: scripts/check-tag-matches-version.sh "${{ github.ref_name }}"

      - name: Refuse unless this commit has an existing green CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-commit-ci-green.sh "${{ github.sha }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: cargo publish --workspace
        # One command, five crates, as today (RFC-090's own non-goal:
        # not changing what is published). If Trusted Publishing is not
        # yet configured for one of the five crates against this exact
        # workflow filename, crates.io refuses the token exchange or the
        # upload here — loudly, in this step's own log, not silently.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace

  github-release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    # Only after crates.io has accepted the upload: the Release is the
    # announcement of a published version, and announcing one that does
    # not exist is worse than announcing it late.
    needs: publish
    permissions:
      # The only job that writes anything. No `id-token`: this job must
      # not be able to speak to crates.io at all.
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          # This is the one job that holds `contents: write`, and it
          # runs repository scripts. Nothing here pushes — `gh` reads
          # `GH_TOKEN` from the environment — so the token has no reason
          # to sit in `.git/config` while those scripts run.
          persist-credentials: false

      - name: Build the release notes from the changelog entry
        # Through `env`, not interpolated into `run:`. The tag filter
        # admits nothing injectable today; this is the same pattern the
        # next step already uses, and it stays safe if the filter ever
        # widens.
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/extract-release-notes.sh "$TAG" > notes.md

      - name: Create or update the GitHub Release
        # A failure here cannot affect the crates: `publish` has already
        # finished, and nothing in this job touches crates.io. The
        # release notes are the only thing at stake, and they can be
        # re-run — "Re-run failed jobs" on this run, which is why there
        # is no `workflow_dispatch` trigger. One would let `publish`
        # start from an untagged ref.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its notes (this is a re-run)."
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
