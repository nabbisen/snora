name: Build cost

on:
  push:
    branches: [main]
    tags:
      # Accept both the project's actual tag shape (no `v` prefix, e.g.
      # `0.25.3`) and a `v`-prefixed shape, so a future convention change
      # cannot silently disable measurement again (RFC-041).
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Avoid recursion: same [skip ci] + path-filter defence as binary-size.yaml.
concurrency:
  group: build-cost-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required for commit-back on release tags

jobs:
  measure:
    name: Measure compile time
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Deliberately NOT using Swatinem/rust-cache here (RFC-043). This
      # workflow measures *cold* compile time, including iced's full
      # transitive closure. A restored dependency cache would let the
      # timed steps skip that work entirely — measure-compile-time.sh's
      # own `cargo clean -p <snora packages>` only cleans snora's own
      # crates, so with a warm cache the timed builds only ever rebuild a
      # handful of small crates, not a real cold build. This is exactly
      # what produced the ~56s → ~5.5s "improvement" in the 0.19.1 → 0.25.3
      # data that turned out to be a caching artifact, not a real trend.
      # Expect run times of several minutes instead of ~1 minute; that is
      # correct, not a regression — RFC-041's rationale for keeping
      # measurement off the PR path already accounts for it.

      - name: Determine version label
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Prefix-agnostic: strip refs/tags/, then an optional leading
            # `v`, so VERSION is always e.g. "0.25.3", never "v0.25.3" —
            # matching the CSV `version` column in every existing row.
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml | head -n1)
            VERSION="${VERSION}-dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Measuring as: $VERSION"

      - name: Measure
        id: measure
        # SNORA_RUNNER_OS supplies the CSV runner_os column (RFC-044,
        # correcting RFC-043): GitHub Actions' own auto-populated
        # $RUNNER_OS is "Linux", but every historical CSV row other than
        # the 0.25.3/0.26.0 discontinuity uses "ubuntu-latest" (this job's
        # runs-on value). RFC-043 tried `env: RUNNER_OS: ubuntu-latest` —
        # GitHub silently ignores that, because it reserves the entire
        # `RUNNER_*` variable namespace and does not permit overwriting
        # it. SNORA_RUNNER_OS is outside that namespace, so the value
        # actually reaches the script.
        env:
          SNORA_RUNNER_OS: ubuntu-latest
        run: |
          ROW=$(scripts/measure-compile-time.sh "${{ steps.version.outputs.version }}")
          echo "row=$ROW" >> "$GITHUB_OUTPUT"
          echo "Measurement: $ROW"

      - name: Write job summary
        run: |
          ROW="${{ steps.measure.outputs.row }}"
          IFS=',' read -r v ws_ms wid_ms eng_ms hel_ms wid_design_ms wb_ms rustc os date <<<"$ROW"
          {
            echo "## Build cost — \`$v\`"
            echo
            echo "| Configuration | ms |"
            echo "|---|---:|"
            echo "| check workspace (all-features) | $ws_ms |"
            echo "| build snora-widgets (release) | $wid_ms |"
            echo "| build engine-only (release) | $eng_ms |"
            echo "| build example-hello (release-baseline) | $hel_ms |"
            echo "| build snora-widgets + design (release) | $wid_design_ms |"
            echo "| build design workbench (release-baseline) | $wb_ms |"
            echo
            echo "Rustc: \`$rustc\` · OS: $os · Date: $date"
            echo
            echo "Watch point: widgets cold build > 30 000 ms → review feature-gating-criteria.md indicator 1."
            if (( wid_ms > 30000 )); then
              echo
              echo ":warning: **Widgets build exceeds 30 s watch point.** Investigate before publishing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-cost-${{ steps.version.outputs.version }}
          path: /tmp/snora-build-cost-*.log
          if-no-files-found: warn
          retention-days: 30

      # Tag-only: append row to CSV and commit back with [skip ci].
      - name: Append row to compile-time CSV
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ steps.measure.outputs.row }}" >> \
            docs/src/reference/build-cost-budget/compile-time.csv

      - name: Commit and push to main
        if: startsWith(github.ref, 'refs/tags/')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            docs: append build cost for ${{ github.ref_name }} [skip ci]
          file_pattern: docs/src/reference/build-cost-budget/compile-time.csv
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
