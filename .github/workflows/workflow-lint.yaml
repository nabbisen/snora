name: Workflow lint

# Validates every file under .github/workflows/ with actionlint
# (scripts/check-workflows.sh). This MUST be its own file, not a job
# inside ci.yaml: a broken workflow file produces zero jobs, not a
# failing job, so a validator living inside ci.yaml would have been
# just as absent as everything else during the incident this exists
# for (`183cc70`, fixed in `0b382a6` — an unquoted step name containing
# ": " made the entire ci.yaml unparseable, and GitHub reported nothing
# but a bare "failure" with no jobs to inspect). The validator has to
# live somewhere the failure it validates cannot also take down.
#
# No path filter: a workflow file can be broken by a change anywhere in
# the directory (a shared anchor, a reusable step), and the job is
# cheap enough that restricting it buys nothing.
#
# The residual limit, stated rather than hidden: if THIS file becomes
# unparseable, nothing reports that either — there is no escape from
# that regress, since every validator is itself a file that can break.
# What this buys is that ci.yaml (edited three times this cycle) is
# covered by a file that rarely is. Keep this one minimal so that stays
# true; it should need to change only when the pinned actionlint
# version in check-workflows.sh does.

on:
  push:
    branches: [main]
  pull_request:
  # Reviewer-required (R-1, 2026-09-02): without this, dispatching the
  # check against an arbitrary ref (e.g. a scratch branch carrying a
  # deliberately broken workflow, to prove this job actually refuses)
  # was impossible -- push/pull_request only fire against main or an
  # open PR. This is also simply how anyone re-runs this check by hand
  # on a ref, which is the first thing they'll want when it fires.
  workflow_dispatch:

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

# Least authority (RFC-140): the floor for every job in this file. Nothing here writes to the repository, and no job
# needs a token beyond reading it; a job that ever does must say so itself.
permissions:
  contents: read

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's release server answered 504 twice in two days, with nothing
      # wrong in the workflows. So the pinned actionlint **archive** is cached
      # (never the unpacked binary: that would run with no check at all), and
      # `scripts/check-workflows.sh` verifies the archive's pinned SHA-256 on
      # every run, cached or downloaded, before it unpacks anything. The key
      # is the pinned version and platform; a changed pin is a new entry.
      - id: pin
        run: echo "version=$(sed -n 's/^ACTIONLINT_VERSION="\(.*\)"/\1/p' scripts/check-workflows.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/actionlint-cache
          key: actionlint-archive-${{ steps.pin.outputs.version }}-linux-amd64
      - run: scripts/check-workflows.sh
      # RFC-140. Three cheap checks that need no network, so they sit here beside the validator and not in ci.yaml: this file
      # is the one that cannot be taken down by the failure it reports (see the head of this file).
      #   1. every `uses:` in every workflow is a full commit SHA with a release comment, and every workflow declares
      #      `permissions:` (a pin to a tag or a branch can move under a release);
      #   2. the tests of the release's tag-signature check, with scratch keys: `gpg` and the script on this runner image
      #      are proven on every push, before a release depends on them;
      #   3. the tests of the toolchain installer that replaced `dtolnay/rust-toolchain`, against a fake `rustup`.
      - name: Actions are pinned, and the release path's own scripts behave
        run: |
          scripts/check-action-pins.sh
          scripts/test-check-tag-signature.sh
          scripts/test-install-rust-toolchain.sh
