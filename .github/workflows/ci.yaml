name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        # Runs first and cheapest. This gate was absent until 0.28.1, and in
        # its absence `cargo fmt --check` silently stopped passing on a clean
        # tree for several releases while release-process.md still listed it
        # as a checklist item. A gate nothing runs is not a gate.
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rustdoc (F-38, RFC-089)
        # RFC-083 shipped because a docs.rs build failed on a published crate.
        # 46 warnings (44 by our own 2026-09-01 recount) is the state that came
        # from — cleared first (RFC-089), gated here second, per RFC-079's
        # own rule: a gate that ships red is one people learn to ignore.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - name: Test core
        run: cargo test -p snora-core
      - name: Test design tokens (Q4 + Q5 — token sanity and contrast)
        # snora-design is iced-free and fast. Runs on every PR.
        # Failing here means a palette color violates a mandatory WCAG contrast
        # pair or a token value is out of range. See RFC-026 gates Q4 and Q5.
        run: cargo test -p snora-design
      - name: Test engine (render semantics)
        run: cargo test -p snora
      - name: Test engine, all features (RFC-087)
        # The default-features run above never exercised anything gated
        # behind widgets/design/lucide-icons/svg-icons — 10 additional
        # unit tests and 2 additional doc-tests, counted 2026-09-01.
        run: cargo test -p snora --all-features
      - name: Test widgets, all features (RFC-087)
        # snora-widgets had no test step in CI at all before this — not a
        # feature gap, an entire crate. 28 unit tests + 6 doc-tests
        # counted 2026-09-01, including the RFC-085 contrast suite, which
        # only exists under --all-features (it needs the `design` feature
        # to construct a `Tokens` preset).
        run: cargo test -p snora-widgets --all-features
      - name: Test style, all features (RFC-087)
        # Also never run. 26 unit tests + 3 doc-tests (1 ignored) counted
        # 2026-09-01. snora-style declares no [features], so this is
        # identical to a default-features run — --all-features here is
        # for uniformity with the other two new steps, not because it
        # changes anything.
        run: cargo test -p snora-style --all-features
      - name: Check engine-only build (Q1 — minimal path)
        run: cargo check -p snora --no-default-features

  feature-matrix:
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Baseline (unchanged) ----
          - name: default
            args: ""
          - name: no-default-features
            args: "--no-default-features"
          - name: widgets
            args: "--no-default-features --features widgets"
          - name: widgets-lucide-icons
            args: "--no-default-features --features widgets,lucide-icons"
          - name: widgets-svg-icons
            args: "--no-default-features --features widgets,svg-icons"
          - name: all-public-features
            args: "--all-features"
          # ---- Design feature combinations (RFC-026 Q2 / Q2-B) ----
          # widgets,design: the primary design activation path.
          - name: widgets-design
            args: "--no-default-features --features widgets,design"
          # widgets,design,lucide-icons: icon features stay independent of design.
          - name: widgets-design-lucide-icons
            args: "--no-default-features --features widgets,design,lucide-icons"
          # widgets,design,svg-icons: same for svg-icons.
          - name: widgets-design-svg-icons
            args: "--no-default-features --features widgets,design,svg-icons"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check feature combination
        run: cargo check -p snora ${{ matrix.args }}

  design-isolation:
    # Q2-B and Q3: verify that widgets-without-design compiles cleanly and
    # that snora-design itself has no iced dependency. Also RFC-083: the
    # same iced-free property, held for snora-core under --all-features.
    #
    # RFC-087: this job used to also run `cargo test -p snora-design`
    # (the "contract check" step, below the RFC-083 gate). Confirmed
    # byte-identical to `rust-quality`'s "Test design tokens" step —
    # snora-design declares no [features], so there is no feature-set
    # difference between the two invocations to justify running it
    # twice. Removed here; it stays exactly once, in `rust-quality`,
    # which already carries the Q4/Q5 rationale comment.
    name: Design feature isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: widgets compiles without design (Q2-B)
        run: cargo check -p snora-widgets --no-default-features
      - name: snora-design has no iced dependency (Q3)
        # Verify the iced-free guarantee: snora-design's dependency tree must
        # not include iced. `cargo tree` is the authoritative tool; a clean
        # exit with no iced lines means the gate holds.
        run: |
          TREE=$(cargo tree -p snora-design --prefix none)
          if echo "$TREE" | grep -q "^iced "; then
            echo "ERROR: snora-design depends on iced — Q3 gate violated"
            echo "$TREE"
            exit 1
          fi
          echo "Q3 pass: no iced in snora-design dependency tree"
      - name: snora-core has no iced dependency, under any feature (RFC-083)
        # Same mechanism as the snora-design gate above, checked under
        # --all-features specifically: that is exactly the combination
        # under which lucide-icons' now-removed `iced` feature pulled iced
        # (and winit, and iced's `advanced` feature) into snora-core, the
        # vocabulary crate whose entire identity is "no GUI dependency" —
        # and the combination docs.rs builds, which is how this was found.
        run: |
          TREE=$(cargo tree -p snora-core --all-features --prefix none)
          if echo "$TREE" | grep -q "^iced "; then
            echo "ERROR: snora-core depends on iced under --all-features — RFC-083 gate violated"
            echo "$TREE"
            exit 1
          fi
          echo "RFC-083 pass: no iced in snora-core --all-features dependency tree"
      - name: Workspace iced features are all used (RFC-088 Q-3)
        # The general property RFC-083's gates above don't check: not "does
        # a crate depend on iced" but "does the workspace ask iced for a
        # feature nothing uses" — the shape that let `canvas` (zero
        # occurrences) and `svg` (redundant with our own svg-icons feature)
        # both survive RFC-083 by one line.
        run: scripts/check-workspace-iced-features.sh

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # check-migration-guides.sh derives every minor pair it checks
          # from `git tag`. The default checkout fetches no tags, which
          # made that gate fail silently on every run from c651e93 to
          # f153a2b (D-1 against RFC-087). The other two doc gates read
          # the working tree and do not need this.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mdBook
        run: cargo install mdbook --no-default-features --features search --vers "^0.5" --locked
      - name: Build docs
        run: mdbook build docs
      - name: Test docs (classify fences)
        run: mdbook test docs
      - name: Built links resolve (RFC-073 / RFC-087)
        # Catches a page that exists on disk but was never wired into
        # SUMMARY.md — a source-level .md-link check can't see this,
        # only the built HTML can. Confirmed passing on a clean tree
        # 2026-09-01 before being wired here (RFC-087, RFC-079's own
        # precedent: a gate ships only once the number it checks is
        # known and stable).
        run: python3 scripts/check-built-links.py
      - name: Version snippets match workspace version (RFC-074 / RFC-087)
        run: scripts/check-version-snippets.sh
      - name: Migration guide exists for every adopted minor pair (RFC-079 / RFC-087)
        run: scripts/check-migration-guides.sh

