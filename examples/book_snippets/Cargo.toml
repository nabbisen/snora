[package]
name = "snora-book-snippets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
lucide-icons = ["snora/lucide-icons", "dep:lucide-icons"]
svg-icons = ["snora/svg-icons"]

[dependencies]
snora = { workspace = true, features = ["design"] }
snora-design = { workspace = true }
iced = { workspace = true }
lucide-icons = { workspace = true, optional = true }
