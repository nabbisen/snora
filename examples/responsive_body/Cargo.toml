[package]
name = "snora-example-responsive-body"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "snora-example-responsive-body"
path = "src/main.rs"

# Engine-only: no widgets, no design. See examples/size_probe_engine for
# why this cannot use `snora = { workspace = true }` — workspace
# inheritance cannot override `default-features`. This is the SECOND
# hand-pinned example; see the comment on `workspace.dependencies.snora`
# in the root Cargo.toml, which must be edited alongside this one on
# every minor bump.
[dependencies]
snora = { path = "../../crates/snora", version = "0.53", default-features = false }
# `features = ["default"]` (RFC-112): the workspace iced line no
# longer carries iced's defaults, and this crate turns snora's off, so
# without this it would have no renderer and no windowing backend, and
# winit would refuse to compile for the platform. It wants the build it
# had before RFC-112, and asks for it on its own line rather than
# through snora's `iced-default`, so that what this crate measures
# stays independent of snora's feature graph.
iced  = { workspace = true, features = ["default"] }
