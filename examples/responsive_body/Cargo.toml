[package]
name = "snora-example-responsive-body"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "snora-example-responsive-body"
path = "src/main.rs"

# Engine-only: no widgets, no design. See examples/size_probe_engine for
# why this cannot use `snora = { workspace = true }` — workspace
# inheritance cannot override `default-features`. This is the SECOND
# hand-pinned example; see the comment on `workspace.dependencies.snora`
# in the root Cargo.toml, which must be edited alongside this one on
# every minor bump.
[dependencies]
snora = { path = "../../crates/snora", version = "0.32", default-features = false }
iced  = { workspace = true }
