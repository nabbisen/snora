[package]
name = "snora-size-probe-design-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "snora-size-probe-design-engine"
path = "src/main.rs"

# Design without widgets (RFC-054/RFC-055): the configuration this crate
# exists to measure. Uses an explicit path dep (not workspace
# inheritance) so that default-features = false can be set independently
# of the workspace snora entry — same reason examples/size_probe_engine
# and examples/responsive_body do. This is the THIRD such example; see
# the comment on workspace.dependencies.snora in the root Cargo.toml,
# which must be edited alongside this one on every minor bump.
[dependencies]
snora = { path = "../../crates/snora", version = "0.53", default-features = false, features = ["design"] }
# `features = ["default"]` (RFC-112): the workspace iced line no
# longer carries iced's defaults, and this crate turns snora's off, so
# without this it would have no renderer and no windowing backend, and
# winit would refuse to compile for the platform. It wants the build it
# had before RFC-112, and asks for it on its own line rather than
# through snora's `iced-default`, so that what this crate measures
# stays independent of snora's feature graph.
iced  = { workspace = true, features = ["default"] }
