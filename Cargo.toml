[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*",
]

# Shared package metadata. Member crates pull these in via
# `<field>.workspace = true` so that license, edition, and authorship
# stay declared in exactly one place.
[workspace.package]
version = "0.43.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nabbisen/snora"
authors = ["nabbisen"]

[workspace.dependencies]
# `snora` listed here so example crates pick up its version through
# workspace inheritance. Each example only needs:
#
#     [dependencies]
#     snora = { workspace = true }
#
# When the workspace version bumps, the entries below cover every
# example that uses `snora = { workspace = true }`.
#
# NOT every example does. `examples/size_probe_engine`,
# `examples/responsive_body`, and `examples/size_probe_design_engine`
# all need `default-features = false`, so each pins `snora` explicitly
# and does **not** follow this table. On a minor bump **all three** must
# be edited too — missing any fails every `cargo` command in the
# workspace with "failed to select a version for the requirement
# `snora = "^0.NN"`". Grep for the old minor across all `Cargo.toml`
# files before assuming the workspace table is sufficient.
#
# Including a `version` field (alongside `path`) is required by
# `cargo publish`, even though examples themselves are
# `publish = false`.  Cargo validates the workspace as a whole.
snora = { version = "0.43", path = "crates/snora" }
snora-core = { version = "0.43", path = "crates/snora-core" }
snora-widgets = { version = "0.43", path = "crates/snora-widgets" }
# Iced-free design tokens (Snora Design). Listed here so the `snora` /
# `snora-widgets` crates can pick it up via workspace inheritance once the
# `design` feature wiring lands (RFC-021 / RFC-025). It is a workspace member
# in its own right and has no iced dependency.
snora-design = { version = "0.43", path = "crates/snora-design" }
# The iced style bridge for Snora Design tokens (RFC-055). Structurally
# below the widget layer — snora-widgets depends on it, not the reverse
# — and depends on nothing but iced and snora-design (in particular not
# snora-core), the same layering property snora-design itself has.
snora-style = { version = "0.43", path = "crates/snora-style" }

# Corrected (RFC-088): `canvas` and `svg` removed — `canvas` had zero
# occurrences anywhere in `crates/`, and `svg` is used only under our
# own `svg-icons` feature, which already declares `"iced/svg"`
# (`crates/snora/Cargo.toml`, `crates/snora-widgets/Cargo.toml`) — this
# line was forcing it on every consumer regardless.
#
# `tokio` stays, measured rather than assumed: `crates/snora/src/
# toast.rs`'s `subscription()` (unconditional, no snora feature gate)
# calls `iced::time::every`, which does not exist at all without an
# executor feature compiled into `iced` — confirmed by removing this
# feature and hitting `error[E0425]: cannot find function 'every' in
# module 'iced::time'`. This is not the same shape as `canvas`/`svg`
# (an unused capability) — it is a real, unconditional compile-time
# requirement of `snora`'s own baseline functionality. Gating
# `subscription()` behind a new opt-in feature would remove the forced
# choice, but is a bigger API change than "one line," was not asked
# for, and is not added here without saying so first.
iced = { version = "0.14", features = ["tokio"] }
lucide-icons = { version = "1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[profile.dev]
opt-level = 1
lto = false
incremental = false

# `release-baseline` is the profile used by the binary-size budget
# CI workflow.  It mirrors `release` for size-affecting flags
# (`opt-level = "z"`, `strip = true`) but drops LTO and bumps
# codegen-units so the build completes in a few minutes rather
# than tens.
#
# The trade-off: stripped binaries built under this profile are
# typically 20-40% larger than what a user shipping with
# `[profile.release]` would see.  That is acceptable because the
# budget tracks **drift between releases**, not absolute sizes --
# as long as every measurement uses the same profile, the
# release-to-release diff stays meaningful.  See
# docs/src/reference/binary-size-budget.md for the full rationale.
[profile.release-baseline]
inherits = "release"
lto = false
codegen-units = 16
