[package]
name = "snora-style"
description = "iced style bridge for Snora Design tokens — maps Tokens to iced style structs. No widgets, no Element, no layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["gui", "design-system", "tokens", "iced"]
categories = ["gui"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Deliberately minimal (RFC-054/RFC-055): the style layer is structurally
# below the widget layer — it imports nothing from snora-widgets or
# snora-core, only iced (the styles it produces) and snora-design (the
# tokens it maps from). If a change here ever needs a third dependency,
# that is a finding, not a routine addition — see RFC-055 §6 step 1.
[features]
default = ["iced-default"]
# Turning this off is how an application takes iced's default features
# into its own hands: the renderers, the windowing backends and
# `linux-theme-detection` with its zbus and mundy trees (RFC-112). It
# is on by default, so a plain `cargo add` is unchanged; an
# application that turns it off must name its own iced features, or
# nothing will draw and winit will refuse to compile for the platform.
iced-default = ["iced/default"]

[dependencies]
snora-design = { workspace = true }
iced = { workspace = true }
