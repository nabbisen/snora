[package]
name = "snora-widgets"
description = "Optional prefab iced widgets for the Snora GUI framework — header, footer, sidebar, menu, icon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["gui", "iced", "ui", "framework"]
categories = ["gui"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["iced-default"]
# Turning this off is how an application takes iced's default features
# into its own hands: the renderers, the windowing backends and
# `linux-theme-detection` with its zbus and mundy trees (RFC-112). It
# is on by default, so a plain `cargo add` is unchanged; an
# application that turns it off must name its own iced features, or
# nothing will draw and winit will refuse to compile for the platform.
#
# `snora-style?/iced-default` keeps its `?`: it reaches snora-style
# only when `design` has already pulled it in, so turning iced's
# defaults back on does not drag the style bridge along with them.
iced-default = ["iced/default", "snora-style?/iced-default"]

# When enabled, exposes the Snora Design prefab widgets (`snora_widgets::design`
# — button, card, notice, chip, progress, chrome geometry). NOT the style
# bridge itself: that moved to `snora-style` (RFC-055), and `snora-widgets`
# no longer re-exports it (RFC-056 removed the `design::style`/`design::theme`
# compatibility shims once `snora::design::style`/`::theme` pointed at
# `snora-style` directly). This feature still pulls in `snora-design`
# (tokens) and `snora-style` (the bridge these widgets style themselves
# with internally) — opt-in, does NOT activate by default.
design = ["dep:snora-design", "dep:snora-style"]
# Pass-through to snora-core's icon-source features. Applications that
# enable `snora/lucide-icons` automatically light up the matching path
# in this crate.
lucide-icons = ["snora-core/lucide-icons", "dep:lucide-icons"]
svg-icons = ["snora-core/svg-icons", "iced/svg"]

[dependencies]
snora-core = { workspace = true }
snora-design = { workspace = true, optional = true }
# The iced style bridge (RFC-055). Optional, tied to the `design`
# feature — keeping it optional is what stops the default configuration
# (`widgets` without `design`) from compiling any style code.
snora-style = { workspace = true, optional = true }
iced = { workspace = true }
lucide-icons = { workspace = true, optional = true }
