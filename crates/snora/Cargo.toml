[package]
name = "snora"
description = "iced engine for the Snora GUI framework. Consumes snora-core vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["gui", "iced", "ui", "framework", "rtl"]
categories = ["gui", "development-tools", "accessibility", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `widgets` is on by default — most applications want the prefab
# header / sidebar / footer / menu / icon helpers. Opt out with
# `default-features = false` to ship an engine-only build.
default = ["widgets"]

# Pulls in the snora-widgets crate and re-exports it under the
# `snora::widget` module path (preserving the 0.5.x import shape).
widgets = ["dep:snora-widgets"]

# Enables the Snora Design style bridge: token types, the iced style
# functions (`snora-style`, RFC-055), and the token-derived engine
# surfaces (`design::render`, `design::responsive_render`). Independent
# of `widgets` (RFC-055) — the prefab-widget re-exports under
# `snora::design` (`widget`, `button`, `card`, `notice`, `chip`,
# `progress`) additionally require `widgets` and are `#[cfg]`-gated for
# it in `src/design.rs`; everything else works with `design` alone.
# Opt-in by policy; default-on requires an explicit size/build-cost
# review and a future RFC or release decision. Measurement data tracked
# in docs/src/reference/binary-size-budget.md and build-cost-budget.md.
#
# `"snora-widgets?/design"` MUST keep its `?` (RFC-054/RFC-055): it
# activates snora-widgets's own `design` submodule only when
# snora-widgets is already present via `widgets`, so `design` alone does
# not pull `widgets` in. Dropping the `?`, or dropping this entry
# entirely, breaks the `widgets` + `design` combination with an E0433 —
# this exact bug was found the hard way in RFC-054's own spike and
# recurred once already when re-deriving this crate's own spike (see
# the RFC-054/RFC-055 review packages).
design = ["dep:snora-design", "dep:snora-style", "snora-widgets?/design"]

# Icon-source features. They configure both `snora-core` (vocabulary)
# and `snora-widgets` (rendering) when the latter is enabled.
lucide-icons = [
    "snora-core/lucide-icons",
    "snora-widgets?/lucide-icons",
    "dep:lucide-icons",
]
svg-icons = [
    "snora-core/svg-icons",
    "snora-widgets?/svg-icons",
    "iced/svg",
]

[dependencies]
snora-core = { workspace = true }
snora-widgets = { workspace = true, optional = true }
snora-design = { workspace = true, optional = true }
# The iced style bridge (RFC-055) — design/render.rs's card_raised and
# to_iced_color calls reach this directly, without depending on
# snora-widgets. Optional, tied to the `design` feature.
snora-style = { workspace = true, optional = true }
iced = { workspace = true }
lucide-icons = { workspace = true, optional = true }

[dev-dependencies]
# Headless test harness for render-semantics tests (RFC-011-D).
# Dev-only: no impact on binary size or public feature surface.
iced_test = "0.14"
